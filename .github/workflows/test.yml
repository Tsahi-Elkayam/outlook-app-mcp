name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the wheel holds every AppleScript and runs
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          want=$(cd src && find outlook_app_mcp -name '*.applescript' | sort)
          have=$(python -m zipfile -l "$wheel" | awk '{print $1}' | grep '\.applescript$' | sort)
          diff <(echo "$want") <(echo "$have")
          uvx --from "$wheel" outlook-app-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
