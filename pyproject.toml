[project]
name = "outlook-app-mcp"
version = "0.3.0"
description = "MCP server that drives the Outlook desktop app (Outlook for Mac in Legacy mode, classic Outlook for Windows): mail, calendar, meetings, tasks, notes, contacts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "outlook", "claude", "email", "calendar", "applescript", "com"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
]
authors = [
    { name = "Tsahi Elkayam", email = "etsahi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "icalendar>=7.3",
    "recurring-ical-events>=3.8.2",
    "pywin32>=311; sys_platform == 'win32'",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Tsahi-Elkayam/outlook-app-mcp"
Issues = "https://github.com/Tsahi-Elkayam/outlook-app-mcp/issues"
Changelog = "https://github.com/Tsahi-Elkayam/outlook-app-mcp/blob/main/CHANGELOG.md"

[project.scripts]
outlook-app-mcp = "outlook_app_mcp:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/mac", "tests/windows"]
